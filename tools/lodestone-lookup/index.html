<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lodestone 角色查詢 - FF14.tw</title>
    <meta name="description" content="輸入名字和伺服器，查 FF14 國際版角色的職業等級、成就與收藏；也可以直接貼上 Lodestone 角色頁的網址或 ID。">
    <meta name="keywords" content="FF14, FFXIV, Final Fantasy XIV, Lodestone, 角色查詢, 角色資訊, Character Lookup">
    <link rel="canonical" href="https://ff14.tw/tools/lodestone-lookup/">

    <link rel="icon" type="image/x-icon" href="../../assets/images/ff14tw.ico">
    <!-- 分享預覽與主畫面：由 scripts/share-preview.mjs 產生，改了分頁標題或說明後重跑 -->
    <meta property="og:site_name" content="FF14.tw">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="zh_TW">
    <meta property="og:title" content="Lodestone 角色查詢 - FF14.tw">
    <meta property="og:description" content="輸入名字和伺服器，查 FF14 國際版角色的職業等級、成就與收藏；也可以直接貼上 Lodestone 角色頁的網址或 ID。">
    <meta property="og:image" content="https://ff14.tw/assets/images/og/lodestone-lookup.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Lodestone 角色查詢：用名字或 Lodestone ID 查 FF14 國際版角色的職業等級、成就與收藏">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-title" content="Lodestone 角色查詢">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="../../assets/images/icons/apple-touch-icon.png">
    <!-- /分享預覽與主畫面 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/tokens.css">
    <link rel="stylesheet" href="../../assets/css/common.css">
    <link rel="stylesheet" href="../../assets/css/tools-common.css">
    <link rel="stylesheet" href="../../assets/css/components/language-switcher.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="header-placeholder" data-base-path="../../" data-tool-name="Lodestone 角色查詢" data-tool-name-key="lodestone_header"></div>
    <noscript>
        <nav class="noscript-nav">
            <a href="/" class="noscript-nav-link">首頁</a>
            <a href="/copyright.html" class="noscript-nav-link">版權聲明</a>
            <a href="https://github.com/hydai/ff14.tw" target="_blank" rel="noopener noreferrer" class="noscript-nav-link">GitHub</a>
            <a href="/about.html" class="noscript-nav-link">關於</a>
        </nav>
    </noscript>

    <main class="main">
        <div class="container">
            <h1 class="visually-hidden" data-i18n="lodestone_header">Lodestone 角色查詢</h1>

            <!-- 三種畫面，一次只看得到一個（script.js 切換 hidden）：打開時、搜尋結果、角色。
                 找人（#findCard）只有一份：打開時在我的角色與最近查過中間，搜尋結果時 script.js 把它搬到結果上面 -->
            <div id="lodestoneTool">
                <!-- 打開時：我的角色（有設才有）→ 找人 → 最近查過（有才有）；兩個都沒有是第一次來，上面多一句說明 -->
                <div id="landingView">
                    <p class="first-visit-intro" id="firstVisitIntro" data-i18n="lodestone_intro" hidden>輸入名字和伺服器，查國際版角色的職業等級、成就與收藏。</p>

                    <!-- 我的角色：整張卡片是一顆按鈕，點了打開。頭像、名字與「伺服器（資料中心）・職業 LvN」由 script.js 填。
                         螢幕閱讀器把按鈕裡的字接在一起念：標籤、名字、下面那一行之間放看不見的停頓（.visually-hidden），畫面不變 -->
                    <button type="button" class="card mine-card" id="mineCard" hidden>
                        <span class="card-label" data-i18n="lodestone_mine">我的角色</span>
                        <span class="visually-hidden" data-i18n="lodestone_spoken_sep">，</span>
                        <span class="person">
                            <img class="person-avatar" id="mineAvatar" width="48" height="48" alt="">
                            <span class="person-text">
                                <span class="person-name" id="mineName"></span>
                                <span class="visually-hidden" data-i18n="lodestone_spoken_sep">，</span>
                                <span class="person-meta" id="mineMeta"></span>
                            </span>
                            <span class="person-go" aria-hidden="true" data-i18n="lodestone_open">打開 →</span>
                        </span>
                    </button>

                    <!-- 找人：名字欄也收 Lodestone 角色頁的網址或 ID（直接打開那個角色，不搜尋） -->
                    <section class="card find-card" id="findCard" aria-labelledby="findTitle">
                        <h2 class="card-label" id="findTitle" data-i18n="lodestone_find">找人</h2>
                        <form class="find-form" id="findForm" role="search" aria-labelledby="findTitle">
                            <div class="form-group">
                                <label class="form-label" for="nameInput" data-i18n="lodestone_name_label">角色名字</label>
                                <input type="text" class="form-control" id="nameInput" autocomplete="off" spellcheck="false" enterkeyhint="search" placeholder="例如 Aoi Mizuno" data-i18n="lodestone_name_placeholder" data-i18n-attr="placeholder">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="worldSelect" data-i18n="lodestone_world">伺服器</label>
                                <!-- 值就是官網搜尋的 worldname：空字串是全部，資料中心帶 _dc_；兩組選項由 script.js 照 LODESTONE_WORLDS 填 -->
                                <select class="form-control" id="worldSelect">
                                    <option value="" data-i18n="lodestone_world_all">全部伺服器</option>
                                    <optgroup id="dcOptions" label="資料中心" data-i18n="lodestone_dcs" data-i18n-attr="label"></optgroup>
                                    <optgroup id="worldOptions" label="伺服器" data-i18n="lodestone_world" data-i18n-attr="label"></optgroup>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary" id="searchButton" data-i18n="lodestone_search">搜尋</button>
                            <p class="find-note" data-i18n="lodestone_find_note">也可以直接貼上 Lodestone 角色頁的網址或 ID。只能查國際版的角色。</p>
                            <!-- 名稱與成就顯示：English 對到 Worker 的 dc=na、日本語對到 dc=jp；選中的那顆有 active 與 aria-pressed="true"（script.js 同步） -->
                            <div class="data-lang">
                                <span id="dataLangLabel" data-i18n="lodestone_data_lang">名稱與成就顯示</span>
                                <div class="data-lang-options" id="dataLang" role="group" aria-labelledby="dataLangLabel">
                                    <button type="button" class="chip" data-lang="en" aria-pressed="false">English</button>
                                    <button type="button" class="chip" data-lang="ja" aria-pressed="false">日本語</button>
                                </div>
                            </div>
                        </form>
                    </section>

                    <!-- 最近查過：最多 5 個，新的在上；每一列由 script.js 畫 -->
                    <section class="card recent-card" id="recentCard" aria-labelledby="recentTitle" hidden>
                        <h2 class="card-label" id="recentTitle" data-i18n="lodestone_recent">最近查過</h2>
                        <ul class="person-list" id="recentList"></ul>
                    </section>
                </div>

                <!-- 搜尋結果：「← 找其他人」、找人（填好剛才的條件，script.js 搬過來）、結果。
                     摘要寫在哪裡找到幾個；沒有結果時多一句提示；還有下一頁時多一句；搜尋不能用時寫原因，給到官網搜尋的連結 -->
                <div id="searchView" hidden>
                    <button type="button" class="btn btn-ghost back-button" id="searchBack" data-i18n="lodestone_back">← 找其他人</button>
                    <section class="card result-card" id="resultCard" aria-busy="false">
                        <p class="search-summary" id="searchSummary" aria-live="polite"></p>
                        <ul class="person-list" id="resultList" aria-labelledby="searchSummary"></ul>
                        <p class="search-note" id="searchHint" data-i18n="lodestone_search_hint" hidden>確認伺服器，或貼上他在 Lodestone 的角色頁網址</p>
                        <p class="search-note" id="searchMore" data-i18n="lodestone_search_more" hidden>還有更多結果，請把名字打完整或選伺服器</p>
                        <a class="search-fallback" id="searchFallback" target="_blank" rel="noopener noreferrer" hidden></a>
                    </section>
                </div>

                <!-- 角色：「← 找其他人」、標頭（script.js 畫：載入中、名字與稱號、伺服器與部隊（部隊名稱是切到部隊分頁的按鈕）、目前職業、
                     我的角色、在 Lodestone 打開、名稱與成就顯示（和找人卡片的 #dataLang 同一組按鈕）、資料時間）、六個分頁。
                     標頭打不開時標頭與分頁藏起來，只留錯誤訊息與「← 找其他人」 -->
                <div id="characterView" hidden>
                    <button type="button" class="btn btn-ghost back-button" id="characterBack" data-i18n="lodestone_back">← 找其他人</button>
                    <section class="card profile-card" id="profileCard" aria-busy="false"></section>
                    <div class="error-message" id="characterError" role="alert" hidden></div>
                    <!-- 六個分頁（WAI-ARIA 分頁）：lodestone-tabs.js 切換 aria-selected、tabindex、.active 與面板的 hidden，
                         左右方向鍵移動並切換、Home／End 到第一個／最後一個；面板的內容第一次打開時才載入，由 lodestone-tabs.js 畫 -->
                    <section class="card tabs-card" id="tabsCard" hidden>
                        <div class="tabs" id="tabList" role="tablist" aria-label="角色資料" data-i18n="lodestone_tabs_label" data-i18n-attr="aria-label">
                            <button type="button" class="tab active" id="tab-jobs" role="tab" data-tab="jobs" aria-selected="true" aria-controls="panel-jobs" tabindex="0" data-i18n="lodestone_tab_jobs">職業</button>
                            <button type="button" class="tab" id="tab-achievements" role="tab" data-tab="achievements" aria-selected="false" aria-controls="panel-achievements" tabindex="-1" data-i18n="lodestone_tab_achievements">成就</button>
                            <button type="button" class="tab" id="tab-gear" role="tab" data-tab="gear" aria-selected="false" aria-controls="panel-gear" tabindex="-1" data-i18n="lodestone_tab_gear">裝備</button>
                            <button type="button" class="tab" id="tab-collections" role="tab" data-tab="collections" aria-selected="false" aria-controls="panel-collections" tabindex="-1" data-i18n="lodestone_tab_collections">收藏</button>
                            <button type="button" class="tab" id="tab-fc" role="tab" data-tab="fc" aria-selected="false" aria-controls="panel-fc" tabindex="-1" data-i18n="lodestone_tab_fc">部隊</button>
                            <button type="button" class="tab" id="tab-about" role="tab" data-tab="about" aria-selected="false" aria-controls="panel-about" tabindex="-1" data-i18n="lodestone_tab_about">其他</button>
                        </div>
                        <div class="tab-panel" id="panel-jobs" role="tabpanel" aria-labelledby="tab-jobs" tabindex="0"></div>
                        <div class="tab-panel" id="panel-achievements" role="tabpanel" aria-labelledby="tab-achievements" tabindex="0" hidden></div>
                        <div class="tab-panel" id="panel-gear" role="tabpanel" aria-labelledby="tab-gear" tabindex="0" hidden></div>
                        <div class="tab-panel" id="panel-collections" role="tabpanel" aria-labelledby="tab-collections" tabindex="0" hidden></div>
                        <div class="tab-panel" id="panel-fc" role="tabpanel" aria-labelledby="tab-fc" tabindex="0" hidden></div>
                        <div class="tab-panel" id="panel-about" role="tabpanel" aria-labelledby="tab-about" tabindex="0" hidden></div>
                    </section>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder" data-base-path="../../"></div>

    <script src="../../assets/js/components/layout-loader.js"></script>
    <script src="../../assets/js/common.js"></script>
    <script src="../../assets/js/ff14-game-data.js"></script>
    <script src="lodestone-data.js"></script>
    <script src="lodestone-model.js"></script>
    <script src="lodestone-store.js"></script>
    <script src="lodestone-tabs.js"></script>
    <script src="script.js"></script>
</body>
</html>
