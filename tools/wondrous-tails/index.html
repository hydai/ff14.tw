<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天書奇談預測器 - FF14.tw</title>
    <meta name="description" content="FF14 天書奇談機率預測工具，計算連線成功機率">
    <link rel="icon" type="image/x-icon" href="../../assets/images/ff14tw.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/tokens.css">
    <link rel="stylesheet" href="../../assets/css/common.css">
    <link rel="stylesheet" href="../../assets/css/tools-common.css">
    <link rel="stylesheet" href="../../assets/css/components/language-switcher.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="header-placeholder" data-base-path="../../" data-tool-name="天書奇談預測器" data-tool-name-key="wondrous_tails_header"></div>
    <noscript>
        <nav class="noscript-nav">
            <a href="/" class="noscript-nav-link">首頁</a>
            <a href="/copyright.html" class="noscript-nav-link">版權聲明</a>
            <a href="https://github.com/hydai/ff14.tw" target="_blank" rel="noopener noreferrer" class="noscript-nav-link">GitHub</a>
            <a href="/about.html" class="noscript-nav-link">關於</a>
        </nav>
    </noscript>

    <main class="main">
        <div class="container">
            <div class="page-header">
                <h1 class="visually-hidden" data-i18n="wondrous_tails_header">天書奇談預測器</h1>
                <p class="description" data-i18n="wondrous_tails_desc">點一格貼上貼紙，再點一次拿掉（最多 9 張）</p>
            </div>
            <div class="wondrous-layout" id="wondrousTool">
                <section class="card wondrous-board-card">
                    <div class="board-head">
                        <span class="board-count" id="placed-count">已貼 0／9 張</span>
                        <button type="button" class="btn btn-sm" id="clear-btn" disabled>清空盤面</button>
                    </div>
                    <div class="wondrous-grid" id="wondrous-grid">
                        <button type="button" class="cell grid-cell" data-position="0" aria-pressed="false" aria-label="第 1 格"></button>
                        <button type="button" class="cell grid-cell" data-position="1" aria-pressed="false" aria-label="第 2 格"></button>
                        <button type="button" class="cell grid-cell" data-position="2" aria-pressed="false" aria-label="第 3 格"></button>
                        <button type="button" class="cell grid-cell" data-position="3" aria-pressed="false" aria-label="第 4 格"></button>
                        <button type="button" class="cell grid-cell" data-position="4" aria-pressed="false" aria-label="第 5 格"></button>
                        <button type="button" class="cell grid-cell" data-position="5" aria-pressed="false" aria-label="第 6 格"></button>
                        <button type="button" class="cell grid-cell" data-position="6" aria-pressed="false" aria-label="第 7 格"></button>
                        <button type="button" class="cell grid-cell" data-position="7" aria-pressed="false" aria-label="第 8 格"></button>
                        <button type="button" class="cell grid-cell" data-position="8" aria-pressed="false" aria-label="第 9 格"></button>
                        <button type="button" class="cell grid-cell" data-position="9" aria-pressed="false" aria-label="第 10 格"></button>
                        <button type="button" class="cell grid-cell" data-position="10" aria-pressed="false" aria-label="第 11 格"></button>
                        <button type="button" class="cell grid-cell" data-position="11" aria-pressed="false" aria-label="第 12 格"></button>
                        <button type="button" class="cell grid-cell" data-position="12" aria-pressed="false" aria-label="第 13 格"></button>
                        <button type="button" class="cell grid-cell" data-position="13" aria-pressed="false" aria-label="第 14 格"></button>
                        <button type="button" class="cell grid-cell" data-position="14" aria-pressed="false" aria-label="第 15 格"></button>
                        <button type="button" class="cell grid-cell" data-position="15" aria-pressed="false" aria-label="第 16 格"></button>
                    </div>
                </section>
                <section class="card wondrous-odds-card">
                    <table class="odds-table" id="odds-table">
                        <thead>
                            <tr>
                                <td></td>
                                <th scope="col" data-i18n="wondrous_tails_now">現在</th>
                                <th scope="col" data-i18n="wondrous_tails_after_reset">重置之後</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr data-lines="1">
                                <th scope="row">
                                    <span class="odds-label" data-i18n="wondrous_tails_at_least_1">至少 1 條</span>
                                    <span class="odds-bars" aria-hidden="true"><span class="odds-bar odds-bar-now"></span><span class="odds-bar odds-bar-after"></span></span>
                                </th>
                                <td class="odds-now">—</td>
                                <td class="odds-after">—</td>
                            </tr>
                            <tr data-lines="2">
                                <th scope="row">
                                    <span class="odds-label" data-i18n="wondrous_tails_at_least_2">至少 2 條</span>
                                    <span class="odds-bars" aria-hidden="true"><span class="odds-bar odds-bar-now"></span><span class="odds-bar odds-bar-after"></span></span>
                                </th>
                                <td class="odds-now">—</td>
                                <td class="odds-after">—</td>
                            </tr>
                            <tr data-lines="3">
                                <th scope="row">
                                    <span class="odds-label" data-i18n="wondrous_tails_at_least_3">至少 3 條</span>
                                    <span class="odds-bars" aria-hidden="true"><span class="odds-bar odds-bar-now"></span><span class="odds-bar odds-bar-after"></span></span>
                                </th>
                                <td class="odds-now">—</td>
                                <td class="odds-after">—</td>
                            </tr>
                        </tbody>
                    </table>
                </section>
            </div>
        </div>
    </main>

    <div id="footer-placeholder" data-base-path="../../"></div>

    <script src="../../assets/js/i18n/i18n-manager.js"></script>
    <script src="../../assets/js/i18n/translations/common.js"></script>
    <script src="../../assets/js/i18n/translations/tools/wondrous-tails.js"></script>
    <script src="../../assets/js/components/tools-registry.js"></script>
    <script src="../../assets/js/components/nav-template.js"></script>
    <script src="../../assets/js/components/footer-template.js"></script>
    <script src="../../assets/js/components/layout-loader.js"></script>
    <script src="../../assets/js/common.js"></script>
    <script src="../../assets/js/security-utils.js"></script>
    <script src="tails-odds.js"></script>
    <script src="script.js"></script>
</body>
</html>
