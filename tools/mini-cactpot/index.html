<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仙人微彩計算機 - FF14.tw</title>
    <meta name="description" content="FF14 仙人微彩最佳策略計算工具，分析期望值並推薦最佳選擇">
    <link rel="icon" type="image/x-icon" href="../../assets/images/ff14tw.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/tokens.css">
    <link rel="stylesheet" href="../../assets/css/common.css">
    <link rel="stylesheet" href="../../assets/css/tools-common.css">
    <link rel="stylesheet" href="../../assets/css/components/language-switcher.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="header-placeholder" data-base-path="../../" data-tool-name="仙人微彩計算機" data-tool-name-key="mini_cactpot_header"></div>
    <noscript>
        <nav class="noscript-nav">
            <a href="/" class="noscript-nav-link">首頁</a>
            <a href="/copyright.html" class="noscript-nav-link">版權聲明</a>
            <a href="https://github.com/hydai/ff14.tw" target="_blank" rel="noopener noreferrer" class="noscript-nav-link">GitHub</a>
            <a href="/about.html" class="noscript-nav-link">關於</a>
        </nav>
    </noscript>

    <main class="main">
        <div class="container">
            <h1 class="visually-hidden" data-i18n="mini_cactpot_header">仙人微彩計算機</h1>
            <div class="cactpot-layout" id="cactpotTool">
                <section class="card cactpot-board">
                    <p class="cactpot-status" id="cactpotStatus" aria-live="polite">① 點遊戲已經翻開的那一格</p>
                    <ul class="visually-hidden" id="cactpotLineAverages" hidden></ul>
                    <div class="extended-grid" id="extended-grid">
                        <div class="line-badge line-badge-top" data-line="6" aria-hidden="true">↘</div>
                        <div class="line-badge line-badge-top" data-line="3" aria-hidden="true">↓</div>
                        <div class="line-badge line-badge-top" data-line="4" aria-hidden="true">↓</div>
                        <div class="line-badge line-badge-top" data-line="5" aria-hidden="true">↓</div>
                        <div class="line-badge line-badge-top" data-line="7" aria-hidden="true">↙</div>

                        <div class="line-badge" data-line="0" aria-hidden="true">→</div>
                        <button type="button" class="cell grid-cell" data-position="0" aria-expanded="false" aria-label="左上">?</button>
                        <button type="button" class="cell grid-cell" data-position="1" aria-expanded="false" aria-label="上中">?</button>
                        <button type="button" class="cell grid-cell" data-position="2" aria-expanded="false" aria-label="右上">?</button>
                        <div class="grid-spacer" aria-hidden="true"></div>

                        <div class="line-badge" data-line="1" aria-hidden="true">→</div>
                        <button type="button" class="cell grid-cell" data-position="3" aria-expanded="false" aria-label="左中">?</button>
                        <button type="button" class="cell grid-cell" data-position="4" aria-expanded="false" aria-label="中央">?</button>
                        <button type="button" class="cell grid-cell" data-position="5" aria-expanded="false" aria-label="右中">?</button>
                        <div class="grid-spacer" aria-hidden="true"></div>

                        <div class="line-badge" data-line="2" aria-hidden="true">→</div>
                        <button type="button" class="cell grid-cell" data-position="6" aria-expanded="false" aria-label="左下">?</button>
                        <button type="button" class="cell grid-cell" data-position="7" aria-expanded="false" aria-label="下中">?</button>
                        <button type="button" class="cell grid-cell" data-position="8" aria-expanded="false" aria-label="右下">?</button>
                        <div class="grid-spacer" aria-hidden="true"></div>
                    </div>
                    <div class="cactpot-actions">
                        <button type="button" class="btn" id="undo-btn" data-i18n="mini_cactpot_undo" aria-disabled="true">上一步</button>
                        <button type="button" class="btn" id="next-btn" data-i18n="mini_cactpot_next" aria-disabled="true">下一張</button>
                    </div>
                </section>
                <section class="card cactpot-payout" aria-labelledby="payoutTitle">
                    <h2 class="cactpot-payout-title" id="payoutTitle" data-i18n="mini_cactpot_payout_title">三格總和 → MGP</h2>
                    <dl class="payout-table" id="payoutTable"></dl>
                </section>
            </div>
        </div>
    </main>

    <div id="footer-placeholder" data-base-path="../../"></div>

    <script src="../../assets/js/i18n/i18n-manager.js"></script>
    <script src="../../assets/js/i18n/translations/common.js"></script>
    <script src="../../assets/js/i18n/translations/tools/mini-cactpot.js"></script>
    <script src="../../assets/js/components/tools-registry.js"></script>
    <script src="../../assets/js/components/nav-template.js"></script>
    <script src="../../assets/js/components/footer-template.js"></script>
    <script src="../../assets/js/components/layout-loader.js"></script>
    <script src="../../assets/js/common.js"></script>
    <script src="../../assets/js/security-utils.js"></script>
    <script src="../../assets/js/cell-popover.js"></script>
    <script src="cactpot-solver.js"></script>
    <script src="script.js"></script>
</body>
</html>
