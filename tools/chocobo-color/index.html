<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陸行鳥染色計算器 - FF14.tw</title>
    <meta name="description" content="FF14 陸行鳥染色計算器：選目前和想要的顏色，算出要餵的水果與順序，會比較先餵拉札漢檸檬">
    <link rel="icon" type="image/x-icon" href="../../assets/images/ff14tw.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/tokens.css">
    <link rel="stylesheet" href="../../assets/css/common.css">
    <link rel="stylesheet" href="../../assets/css/tools-common.css">
    <link rel="stylesheet" href="../../assets/css/components/language-switcher.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="header-placeholder" data-base-path="../../" data-tool-name="陸行鳥染色計算器" data-tool-name-key="chocobo_color_header"></div>
    <noscript>
        <nav class="noscript-nav">
            <a href="/" class="noscript-nav-link">首頁</a>
            <a href="/copyright.html" class="noscript-nav-link">版權聲明</a>
            <a href="https://github.com/hydai/ff14.tw" target="_blank" rel="noopener noreferrer" class="noscript-nav-link">GitHub</a>
            <a href="/about.html" class="noscript-nav-link">關於</a>
        </nav>
    </noscript>

    <main class="main">
        <div class="container">
            <div class="page-header">
                <h1 class="visually-hidden" data-i18n="chocobo_color_header">陸行鳥染色計算器</h1>
                <p class="description" data-i18n="chocobo_color_desc">選陸行鳥現在的顏色和想要的顏色，算出要餵哪些水果、照什麼順序餵。</p>
            </div>
            <div class="chocobo-layout" id="chocoboTool">
                <!-- 兩顆顏色按鈕：資料載入完才能按（先 disabled）；名稱與色塊由 script.js 寫 -->
                <section class="card color-pick-card">
                    <div class="color-pick">
                        <span class="color-pick-label" id="fromLabel" data-i18n="chocobo_color_current">目前顏色</span>
                        <button type="button" class="color-btn" id="fromBtn" aria-haspopup="dialog" aria-labelledby="fromLabel fromName" disabled>
                            <span class="color-chip" id="fromChip" aria-hidden="true"></span>
                            <span class="color-btn-name" id="fromName"></span>
                            <span class="color-btn-caret" aria-hidden="true">▾</span>
                        </button>
                    </div>
                    <span class="color-pick-arrow" aria-hidden="true">→</span>
                    <div class="color-pick">
                        <span class="color-pick-label" id="toLabel" data-i18n="chocobo_color_target">目標顏色</span>
                        <button type="button" class="color-btn" id="toBtn" aria-haspopup="dialog" aria-labelledby="toLabel toName" disabled>
                            <span class="color-chip" id="toChip" aria-hidden="true"></span>
                            <span class="color-btn-name" id="toName"></span>
                            <span class="color-btn-caret" aria-hidden="true">▾</span>
                        </button>
                    </div>
                </section>

                <!-- 答案卡由 script.js 畫：有答案之前先藏起來，不然會閃一下空的框。不是 aria-live，朗讀區在下面那一行：
                     換顏色或語言後念摘要，不照順序打勾、新跳過一段時改念那一段的提醒（script.js 的 announceSkipped()） -->
                <section class="card answer-card" id="answerCard" hidden></section>
                <p class="visually-hidden" id="answerAnnounce" aria-live="polite"></p>

                <div class="chocobo-notes">
                    <p data-i18n="chocobo_color_note_range">顏色名稱涵蓋一小段 RGB。之前餵過水果的話，實際數值可能和標準值有落差，結果可能差一點；先餵檸檬是從確定的沙漠黃開始。</p>
                    <p data-i18n="chocobo_color_note_wait">一般水果餵完約 6 小時才會變色。</p>
                    <p><span data-i18n="chocobo_color_credit">顏色資料參考自</span> <a href="https://ffxivchocobo.com/" target="_blank" rel="noopener noreferrer">ffxivchocobo.com</a></p>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder" data-base-path="../../"></div>

    <script src="../../assets/js/i18n/i18n-manager.js"></script>
    <script src="../../assets/js/i18n/translations/common.js"></script>
    <script src="../../assets/js/i18n/translations/tools/chocobo-color.js"></script>
    <script src="../../assets/js/components/tools-registry.js"></script>
    <script src="../../assets/js/components/nav-template.js"></script>
    <script src="../../assets/js/components/footer-template.js"></script>
    <script src="../../assets/js/components/layout-loader.js"></script>
    <script src="../../assets/js/common.js"></script>
    <script src="chocobo-solver.js"></script>
    <script src="script.js"></script>
</body>
</html>
