<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天氣預報 - FF14.tw</title>
    <meta name="description" content="查看艾歐澤亞各地區的天氣預報，搜尋特定天氣條件，追蹤特殊事件">
    <link rel="icon" type="image/x-icon" href="../../assets/images/ff14tw.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/tokens.css">
    <link rel="stylesheet" href="../../assets/css/common.css">
    <link rel="stylesheet" href="../../assets/css/tools-common.css">
    <link rel="stylesheet" href="../../assets/css/components/language-switcher.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="header-placeholder" data-base-path="../../" data-tool-name="天氣預報" data-tool-name-key="weather_header"></div>
    <noscript>
        <nav class="noscript-nav">
            <a href="/" class="noscript-nav-link">首頁</a>
            <a href="/copyright.html" class="noscript-nav-link">版權聲明</a>
            <a href="https://github.com/hydai/ff14.tw" target="_blank" rel="noopener noreferrer" class="noscript-nav-link">GitHub</a>
            <a href="/about.html" class="noscript-nav-link">關於</a>
        </nav>
    </noscript>

    <main class="main">
        <div class="container">
            <h1 class="visually-hidden" data-i18n="weather_header">天氣預報</h1>

            <div class="wx-layout" id="weatherTool">
                <!-- 左欄：選擇區（時鐘、地區、天氣、更多條件） -->
                <aside class="wx-side card">
                    <div class="wx-clock">
                        <span class="wx-clock-item"><span data-i18n="weather_current_et">ET</span> <span class="wx-clock-value" id="currentET">--:--</span></span>
                        <span class="wx-clock-item"><span data-i18n="weather_current_lt">本地</span> <span class="wx-clock-value" id="currentLT">--:--</span></span>
                    </div>

                    <p class="wx-prompt" id="firstVisitPrompt" data-i18n="weather_first_prompt">想查哪裡的什麼天氣？</p>

                    <div class="wx-field">
                        <div class="wx-field-head">
                            <label class="form-label" for="zoneSelect" data-i18n="weather_zone_label">地區</label>
                            <button class="btn btn-sm btn-ghost" id="shareBtn" type="button" hidden>
                                <span class="btn-icon" aria-hidden="true">🔗</span>
                                <span data-i18n="weather_share">分享連結</span>
                            </button>
                        </div>
                        <select class="form-control" id="zoneSelect">
                            <!-- 區域（optgroup）與地區（option）由 JavaScript 依目前語言產生 -->
                            <option value="" disabled hidden selected data-i18n="weather_zone_placeholder">選擇地區</option>
                        </select>
                        <p class="form-text" id="zoneHint" data-i18n="weather_zone_hint">選了地區，這裡會列出那裡會出現的天氣。</p>
                    </div>

                    <div class="wx-field" id="weatherField" hidden>
                        <span class="form-label" id="weatherFieldLabel" data-i18n="weather_weather_label">天氣</span>
                        <div class="chip-group weather-tags" id="desiredWeatherTags" role="group" aria-labelledby="weatherFieldLabel"></div>
                    </div>

                    <details class="wx-more" id="moreConditions" hidden>
                        <summary><span data-i18n="weather_more_conditions">更多條件：時段、前置天氣</span> <span class="wx-more-summary" id="moreSummary"></span></summary>
                        <div class="wx-more-body">
                            <div class="wx-field">
                                <span class="form-label" id="timeRangeLabel" data-i18n="weather_time_range">時段（艾歐澤亞時間）</span>
                                <!-- 24 個時間格子由 JavaScript 產生 -->
                                <div class="time-grid" id="timeGrid" role="group" aria-labelledby="timeRangeLabel"></div>
                                <p class="time-range-display" id="timeRangeText">00:00 - 24:00</p>
                            </div>
                            <div class="wx-field">
                                <span class="form-label" id="previousWeatherLabel" data-i18n="weather_previous_weather">前置天氣（釣魚用）</span>
                                <div class="chip-group weather-tags" id="previousWeatherTags" role="group" aria-labelledby="previousWeatherLabel"></div>
                            </div>
                            <button class="btn btn-sm btn-ghost" id="clearFiltersBtn" type="button" data-i18n="weather_clear_filters">清除條件</button>
                        </div>
                    </details>
                </aside>

                <!-- 右欄：還沒選地區時的說明；選了地區之後由上而下是答案卡、之後幾次、這個地區的天氣時刻表 -->
                <section class="wx-main">
                    <div class="empty-state wx-empty" id="noZoneSelected">
                        <div class="empty-state-icon" aria-hidden="true">🌦️</div>
                        <p class="empty-state-title" data-i18n="weather_empty_title">先選地區和天氣</p>
                        <p class="empty-state-text" data-i18n="weather_empty_text">這裡會寫它下次什麼時候出現、還要等多久。下次打開會記得你選的。</p>
                    </div>

                    <div class="wx-zone" id="zoneContent" hidden>
                        <!-- 答案卡：選的天氣下次什麼時候出現、還要多久、到幾點（沒選天氣時是這個地區現在的天氣）。
                             文字由 JavaScript 寫入、每分鐘更新，所以不放 aria-live -->
                        <div class="card wx-answer" id="answerCard">
                            <h2 class="wx-eyebrow" id="answerEyebrow"></h2>
                            <p class="wx-when" id="answerWhen"></p>
                            <p class="wx-wait" id="answerWait"></p>
                            <p class="wx-meta" id="answerMeta"></p>
                            <p class="wx-meta" id="answerExtra" hidden></p>
                        </div>

                        <!-- 之後幾次：答案卡那一次之後的幾次，每一次一列，由 JavaScript 產生 -->
                        <div class="card wx-section" id="nextSection" hidden>
                            <h2 class="wx-section-title" id="nextTitle" tabindex="-1" data-i18n="weather_next_title">之後幾次</h2>
                            <ol class="wx-next" id="nextList"></ol>
                            <button class="btn btn-outline btn-block" id="nextMoreBtn" type="button" data-i18n="weather_show_more">顯示更多</button>
                        </div>

                        <div class="card wx-section" id="timetableSection">
                            <h2 class="wx-section-title" id="timetableTitle" tabindex="-1"></h2>
                            <div class="table-wrap">
                                <table class="table results-table">
                                    <thead>
                                        <tr>
                                            <th data-i18n="weather_col_local_time">本地時間</th>
                                            <th data-i18n="weather_col_eorzea_time">ET</th>
                                            <th data-i18n="weather_col_weather">天氣</th>
                                        </tr>
                                    </thead>
                                    <!-- 每 8 ET 小時一列，由 JavaScript 產生 -->
                                    <tbody id="resultsBody"></tbody>
                                </table>
                            </div>
                            <button class="btn btn-outline btn-block" id="showMoreBtn" type="button" data-i18n="weather_show_more">顯示更多</button>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <div id="footer-placeholder" data-base-path="../../"></div>

    <script src="../../assets/js/i18n/i18n-manager.js"></script>
    <script src="../../assets/js/i18n/translations/common.js"></script>
    <script src="../../assets/js/i18n/translations/tools/weather-forecast.js"></script>
    <script src="../../assets/js/components/tools-registry.js"></script>
    <script src="../../assets/js/components/nav-template.js"></script>
    <script src="../../assets/js/components/footer-template.js"></script>
    <script src="../../assets/js/components/layout-loader.js"></script>
    <script src="../../assets/js/common.js"></script>
    <script src="../../assets/js/security-utils.js"></script>
    <script src="zone-data.js"></script>
    <script src="weather-calculator.js"></script>
    <script src="weather-store.js"></script>
    <script src="weather-search.js"></script>
    <script src="weather-answer.js"></script>
    <script src="script.js"></script>
</body>
</html>
