<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>巨集轉換器 - FF14.tw</title>
    <meta name="description" content="把英文、日文攻略的 FF14 生產巨集換成繁體中文；支援生產技能與文字指令。">
    <link rel="icon" type="image/x-icon" href="../../assets/images/ff14tw.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/tokens.css">
    <link rel="stylesheet" href="../../assets/css/common.css">
    <link rel="stylesheet" href="../../assets/css/tools-common.css">
    <link rel="stylesheet" href="../../assets/css/components/language-switcher.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="header-placeholder" data-base-path="../../" data-tool-name="巨集轉換器" data-tool-name-key="macro_converter_header"></div>
    <noscript>
        <nav class="noscript-nav">
            <a href="/" class="noscript-nav-link">首頁</a>
            <a href="/copyright.html" class="noscript-nav-link">版權聲明</a>
            <a href="https://github.com/hydai/ff14.tw" target="_blank" rel="noopener noreferrer" class="noscript-nav-link">GitHub</a>
            <a href="/about.html" class="noscript-nav-link">關於</a>
        </nav>
    </noscript>

    <main class="main">
        <div class="container">
            <div class="page-header">
                <h1 class="visually-hidden" data-i18n="macro_converter_header">巨集轉換器</h1>
                <p class="description" data-i18n="macro_converter_desc">貼上英文或日文的生產巨集，馬上換成繁體中文。</p>
                <p class="scope-note" data-i18n="macro_converter_scope">支援生產技能與文字指令；戰鬥、採集技能還沒有收錄。</p>
            </div>

            <div class="tool-content" id="macroTool">
                <!-- 資料載入中：script.js 在載入的期間拿掉 hidden -->
                <div id="loadingIndicator" class="loading" hidden>
                    <div class="loading-spinner"></div>
                    <p data-i18n="macro_converter_loading">載入翻譯資料中...</p>
                </div>

                <!-- 資料載入失敗：錯誤訊息與「重試」 -->
                <div id="loadError" class="error-message load-error" role="alert" hidden>
                    <p data-i18n="macro_converter_load_error">載入翻譯資料失敗，請按「重試」再試一次。</p>
                    <button type="button" class="btn btn-secondary btn-sm" id="retryLoad" data-i18n="macro_converter_retry">重試</button>
                </div>

                <!-- 目標語言 -->
                <div class="language-selectors">
                    <div class="form-group target-lang-group">
                        <label for="targetLang" data-i18n="macro_converter_target_lang">目標語言</label>
                        <select id="targetLang" class="form-control" autocomplete="off">
                            <option value="zh">繁體中文</option>
                            <option value="en">English</option>
                            <option value="ja">日本語</option>
                        </select>
                    </div>
                </div>

                <!-- 輸入在上、輸出在下（769px 以上左右兩欄）；貼上或打字就立刻轉換，沒有「轉換」鈕 -->
                <div class="macro-panels">
                    <div class="macro-panel card">
                        <div class="panel-header">
                            <label class="panel-title" for="inputMacro" data-i18n="macro_converter_input">輸入巨集</label>
                            <div class="panel-actions">
                                <button type="button" class="btn btn-secondary btn-sm" id="pasteInput" data-i18n="macro_converter_paste">貼上</button>
                                <button type="button" class="btn btn-secondary btn-sm" id="clearInput" data-i18n="macro_converter_clear">清除</button>
                            </div>
                        </div>
                        <!-- 提示字是三行範例（英文、日文、繁中各一行）。換行寫在屬性值裡，所以後兩行不縮排 -->
                        <textarea id="inputMacro" class="form-control macro-textarea" rows="8" spellcheck="false" autocomplete="off"
placeholder="/ac &quot;Muscle Memory&quot; &lt;wait.3&gt;
/ac &quot;確信&quot; &lt;wait.3&gt;
/ac &quot;堅信&quot; &lt;wait.3&gt;"></textarea>
                    </div>

                    <div class="macro-panel card">
                        <div class="panel-header">
                            <label class="panel-title" for="outputMacro" id="outputTitle">繁體中文</label>
                            <div class="panel-actions">
                                <button type="button" class="btn btn-primary btn-sm" id="copyOutput" data-i18n="macro_converter_copy">複製</button>
                            </div>
                        </div>
                        <!-- 要注意的行：沒有問題時整塊隱藏；不是 live region，螢幕閱讀器靠輸出框的 aria-describedby 讀到 -->
                        <ul id="macroWarnings" class="warning-message macro-warnings" role="list" hidden></ul>
                        <textarea id="outputMacro" class="form-control macro-textarea" rows="8" spellcheck="false" autocomplete="off" readonly aria-describedby="macroWarnings"></textarea>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder" data-base-path="../../"></div>

    <script src="../../assets/js/i18n/i18n-manager.js"></script>
    <script src="../../assets/js/i18n/translations/common.js"></script>
    <script src="../../assets/js/i18n/translations/tools/macro-converter.js"></script>
    <script src="../../assets/js/components/tools-registry.js"></script>
    <script src="../../assets/js/components/nav-template.js"></script>
    <script src="../../assets/js/components/footer-template.js"></script>
    <script src="../../assets/js/components/layout-loader.js"></script>
    <script src="../../assets/js/common.js"></script>
    <script src="conversion-engine.js"></script>
    <script src="script.js"></script>
</body>
</html>
