<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>副本資料庫 - FF14.tw</title>
    <meta name="description" content="FF14 副本資料庫：查副本的等級、類型、機制與掉落物。" data-i18n="dungeon_db_description" data-i18n-attr="content">
    <link rel="icon" type="image/x-icon" href="../../assets/images/ff14tw.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/tokens.css">
    <link rel="stylesheet" href="../../assets/css/common.css">
    <link rel="stylesheet" href="../../assets/css/tools-common.css">
    <link rel="stylesheet" href="../../assets/css/components/language-switcher.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="header-placeholder" data-base-path="../../" data-tool-name="副本資料庫" data-tool-name-key="dungeon_db_header"></div>
    <noscript>
        <nav class="noscript-nav">
            <a href="/" class="noscript-nav-link">首頁</a>
            <a href="/copyright.html" class="noscript-nav-link">版權聲明</a>
            <a href="https://github.com/hydai/ff14.tw" target="_blank" rel="noopener noreferrer" class="noscript-nav-link">GitHub</a>
            <a href="/about.html" class="noscript-nav-link">關於</a>
        </nav>
    </noscript>

    <main class="main">
        <div class="container">
            <h1 class="visually-hidden" data-i18n="dungeon_db_header">副本資料庫</h1>

            <div id="dungeonTool">
                <!-- 搜尋和篩選：類型與版本是資料（中文），按鈕的字不翻譯；選取時 script.js 加 active 並把 aria-pressed 改成 true。
                     is-collapsed 和「篩選」按鈕只在手機版面（style.css 的 @media）有用：面板收在按鈕後面，電腦版面看不到按鈕、面板一直在 -->
                <section class="card filter-card is-collapsed" id="filterCard">
                    <div class="search-row">
                        <label class="visually-hidden" id="searchLabel" for="searchInput" data-i18n="dungeon_db_search_label">搜尋副本名稱、機制或掉落物</label>
                        <input type="search" id="searchInput" class="form-control form-control-lg" placeholder="搜尋副本、機制或掉落物" data-i18n="dungeon_db_search_placeholder" data-i18n-attr="placeholder">
                    </div>

                    <!-- 筆數那一行：手機版面是左邊筆數、右邊「篩選」按鈕，面板在這一行下面展開；電腦版面看不到按鈕，這一行只有筆數，style.css 用 order 排在面板後面（卡片底部，接近列表）。
                         鍵盤與螢幕閱讀器的順序是搜尋框 → 筆數 → 「篩選」→ 面板。
                         筆數：沒有搜尋也沒有篩選寫共幾個，否則寫找到幾個，找不到時寫找不到的那一句（看不見，只給螢幕閱讀器）；載入完才有字。
                         「篩選」的文字（有選篩選時加上數字）、aria-expanded 與 #filterCard 的 is-collapsed 由 script.js 照 state.filtersOpen 同步；一開始是收起的 -->
                    <div class="result-bar">
                        <p id="resultCount" aria-live="polite"></p>
                        <button type="button" class="btn" id="filterToggle" aria-expanded="false" aria-controls="filterPanel" data-i18n="dungeon_db_filter_toggle">篩選</button>
                    </div>

                    <div class="filter-panel" id="filterPanel">
                        <div class="filter-group">
                            <span class="filter-label" id="typeLabel" data-i18n="dungeon_db_type_filter">類型</span>
                            <div class="chip-group" id="typeTags" role="group" aria-labelledby="typeLabel">
                                <button type="button" class="chip" data-type="四人迷宮" aria-pressed="false">四人迷宮</button>
                                <button type="button" class="chip" data-type="公會令" aria-pressed="false">公會令</button>
                                <button type="button" class="chip" data-type="8人大型任務" aria-pressed="false">8人大型任務</button>
                                <button type="button" class="chip" data-type="8人討伐殲滅戰" aria-pressed="false">8人討伐殲滅戰</button>
                                <button type="button" class="chip" data-type="聯盟任務" aria-pressed="false">聯盟任務</button>
                                <button type="button" class="chip" data-type="絕境戰" aria-pressed="false">絕境戰</button>
                                <button type="button" class="chip" data-type="誅滅戰" aria-pressed="false">誅滅戰</button>
                                <button type="button" class="chip" data-type="幻巧戰" aria-pressed="false">幻巧戰</button>
                            </div>
                        </div>

                        <div class="filter-group">
                            <span class="filter-label" id="expansionLabel" data-i18n="dungeon_db_expansion_filter">版本</span>
                            <div class="chip-group" id="expansionTags" role="group" aria-labelledby="expansionLabel">
                                <button type="button" class="chip" data-expansion="2.x" aria-pressed="false">2.x (重生之境)</button>
                                <button type="button" class="chip" data-expansion="3.x" aria-pressed="false">3.x (蒼天之禁城)</button>
                                <button type="button" class="chip" data-expansion="4.x" aria-pressed="false">4.x (紅蓮之狂潮)</button>
                                <button type="button" class="chip" data-expansion="5.x" aria-pressed="false">5.x (暗影之逆焰)</button>
                                <button type="button" class="chip" data-expansion="6.x" aria-pressed="false">6.x (曉月之終途)</button>
                                <button type="button" class="chip" data-expansion="7.x" aria-pressed="false">7.x (黃金之遺產)</button>
                            </div>
                        </div>

                        <button type="button" class="btn btn-sm" id="clearFilters" aria-disabled="true" data-i18n="dungeon_db_clear_filters">清除篩選</button>
                    </div>
                </section>

                <!-- 載入中提示：載入完（或失敗）就 hidden -->
                <div class="loading" id="loading">
                    <div class="loading-spinner"></div>
                    <p data-i18n="dungeon_db_loading">載入中...</p>
                </div>

                <!-- 副本列表：一列一個 li，由 script.js 畫 -->
                <ul class="card dungeon-list" id="dungeonList" hidden></ul>

                <!-- 找不到：載入完、真的沒有符合時才顯示。標題與兩顆按鈕由 script.js 照搜尋字與篩選決定：有搜尋字才有「清除搜尋」，有選篩選才有「清除篩選」 -->
                <div class="empty-state" id="noResults" hidden>
                    <p class="empty-state-title" id="noResultsTitle"></p>
                    <button type="button" class="btn" id="clearSearch" data-i18n="dungeon_db_clear_search" hidden>清除搜尋</button>
                    <button type="button" class="btn" id="clearFiltersEmpty" data-i18n="dungeon_db_clear_filters" hidden>清除篩選</button>
                </div>

                <button type="button" class="btn" id="showMore" hidden></button>

                <!-- 載入失敗時只顯示這一則 -->
                <div class="error-message" id="loadError" role="alert" hidden></div>
            </div>

            <!-- 資料來源說明 -->
            <section class="data-source info-panel" id="dataSource">
                <div class="info-panel-icon" aria-hidden="true">📖</div>
                <div class="data-source-content">
                    <h3 class="info-panel-title" data-i18n="dungeon_db_data_source">資料來源</h3>
                    <p class="info-panel-text"><span data-i18n="dungeon_db_data_source_text">本工具的副本資料來自</span> <a href="https://ff14.huijiwiki.com/wiki/%E5%89%AF%E6%9C%AC" target="_blank" rel="noopener noreferrer" data-i18n="dungeon_db_data_source_link">灰機Wiki</a><span data-i18n="dungeon_db_data_source_desc">，經過繁體中文化處理並使用台灣用語，提供更符合台灣玩家習慣的資訊呈現。</span></p>
                    <p class="info-panel-text" id="dataCount"></p>
                </div>
            </section>
        </div>
    </main>

    <div id="footer-placeholder" data-base-path="../../"></div>

    <script src="../../assets/js/i18n/i18n-manager.js"></script>
    <script src="../../assets/js/i18n/translations/common.js"></script>
    <script src="../../assets/js/i18n/translations/tools/dungeon-database.js"></script>
    <script src="../../assets/js/components/tools-registry.js"></script>
    <script src="../../assets/js/components/nav-template.js"></script>
    <script src="../../assets/js/components/footer-template.js"></script>
    <script src="../../assets/js/components/layout-loader.js"></script>
    <script src="../../assets/js/common.js"></script>
    <script src="dungeon-list.js"></script>
    <script src="script.js"></script>
</body>
</html>
